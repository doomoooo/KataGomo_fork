# Accepted Stage68 seed: RTX 4090, exact 19x19, two external CUDA streams.
# The cross-batch optimizer starts from this known-good endpoint and scans
# every family, including its off control, for each requested batch.
numNNServerThreadsPerModel = 2
cudaDeviceToUseThread0 = 0
cudaDeviceToUseThread1 = 0
nnMaxBatchSize = 13
useFP16 = true
requireMaxBoardSize = true
cudaWarmupOnlyMaxBatchSize = true

cudaUseFlashAttentionSm89 = true
cudaUseFlashAttentionBoth16Sm89 = true
cudaDualFfnCutlassTacticSm89 = m128-n64-k32-w64-n32-s3-sw2-tanh-half2
cudaLinear2CutlassTacticSm89 = m128-n128-k32-w64-n64-s4-sw1
cudaPreConvCutlassTacticSm89 = m128-n128-k32-w64-n64-s5-sw1
cudaUseFusedQKRoPE = true
cudaUseQKVRoPEGemmSm89 = true
cudaUsePersistingL2Trunk = true
cudaUsePersistingL2Inner = true
cudaUseScaleBiasSiluVec8Sm89 = true
cudaUsePostConvBNSiluSm89 = true
cudaUseInitialConvFrontend = true
cudaUseFusedPolicyP1 = true
cudaUseExactMaskDownstreamElisionSm89 = true
cudaUseExactMaskElisionSm89 = true
