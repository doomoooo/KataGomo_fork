# Accepted fixed-19x19 SM120 history seed for the RTX 5090 D two-stream scan.
# Every exact batch starts here; family candidates may explicitly replace or
# disable an accepted point, but the scanner does not erase the common graph.
numNNServerThreadsPerModel = 2
cudaDeviceToUseThread0 = 2
cudaDeviceToUseThread1 = 2
nnMaxBatchSize = 13
useFP16 = true

cudaSm120Backend = true
cudaUseFlashAttentionSm120 = true
cudaFlashAttentionSm120Accum = both16
cudaUseWideFFNSingleGemm = false
cudaUseFusedFFN = true
cudaUseFusedFFNAReuseSm120 = true
cudaUseWideQKV = true
cudaUseQKVStridedSm120 = false
cudaUseFusedResidualGemmSm120 = true
cudaUseLinear2ResidualAot = true
cudaUseOutProjectionResidualAot = false
cudaUseRMSNorm384Sm120 = true
cudaUseRMSNorm384Vec8Sm120 = true
cudaUseRMSNorm384TwoWarpSm120 = false
cudaUseFusedQKRoPE = true
cudaUseFusedQKRoPEHalf2Sm120 = true
cudaUseBatchSharedRoPE = false
cudaUseSwiGLU1152Sm120 = true
cudaUseAffineSiluHalf2Sm120 = true
cudaUsePersistingL2Trunk = true
cudaUsePersistingL2Inner = true
